# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build in parallel and cache where possible
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# KSP 2.2.10 registers its generated sources through the legacy kotlin.sourceSets DSL,
# which AGP 9 built-in Kotlin rejects by default. This flag re-allows it so Room's
# KSP-generated code is picked up and compiled.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
